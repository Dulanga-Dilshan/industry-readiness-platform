[project]
name = "advisor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "grpcio",
    "protobuf",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pyyaml",
    "rank-bm25",
    "pyspellchecker",
    "qdrant-client",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "grpcio-tools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_common", "src/advisor"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
