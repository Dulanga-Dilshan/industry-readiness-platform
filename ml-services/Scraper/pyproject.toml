# Merge into your existing pyproject.toml (keep your own build backend if you have one).
[project]
name = "scraper"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "beautifulsoup4",
    "requests",
    "grpcio",
    "protobuf",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "grpcio-tools",
    "httpx",
    "flask>=3.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# three top-level packages in one project
[tool.hatch.build.targets.wheel]
packages = ["src/scraper", "src/classifier", "src/grpc_server"]
